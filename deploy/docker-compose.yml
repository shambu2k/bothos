# bothos local runtime.
# postgres: run ledger, findings, River queue, graph index, and review mapping.
# gateway:  signed webhook receiver plus read-only dispatch metadata lookups.
# worker:   sandboxed agent orchestration and executor-owned GitHub writes.
#
# The gateway/worker reach Postgres via the compose service name, not localhost.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maintbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maintbot-dev}
      POSTGRES_DB: maintbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintbot -d maintbot"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    build: ..
    restart: unless-stopped
    command: ["/usr/local/bin/bothos-gateway", "-addr", ":8090"]
    environment:
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set in deploy/.env}
      DATABASE_URL: postgres://maintbot:${POSTGRES_PASSWORD:-maintbot-dev}@postgres:5432/maintbot
      GITHUB_READ_TOKEN: ${GITHUB_READ_TOKEN:-} # collaborator permission + PR metadata only
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ..
    restart: unless-stopped
    command: ["/usr/local/bin/bothos-worker"]
    environment:
      DATABASE_URL: postgres://maintbot:${POSTGRES_PASSWORD:-maintbot-dev}@postgres:5432/maintbot
      GITHUB_READ_TOKEN: ${GITHUB_READ_TOKEN:-}       # private scans; review checkout stays tokenless
      GITHUB_COMMENT_TOKEN: ${GITHUB_COMMENT_TOKEN:-} # PR/issue comment writes only
      GITHUB_WRITE_TOKEN: ${GITHUB_WRITE_TOKEN:-}     # contents + PR creation (executor only)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PI_MODEL: ${PI_MODEL:-openrouter/deepseek/deepseek-v4-flash-0731}
      PI_SESSION_DIR: /var/lib/bothos/sessions   # persistent per-run PI sessions
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}         # optional; absent = pure-LLM
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-tavily}
    volumes:
      - bothos-sessions:/var/lib/bothos/sessions
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  bothos-sessions:
