name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod declares the module floor (go 1.26.5); the tools build on
          # the runner toolchain. Pin a recent release whose stdlib carried no
          # open advisories when govulncheck ran (1.26.5 had 6 reachable
          # findings fixed only in a not-yet-released 1.26.6; 1.27 is current).
          go-version: "1.27"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test (race, serialized)
        run: go test -count=1 -race -p 1 ./...
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.2
          golangci-lint run --timeout 5m

  vuln:
    runs-on: ubuntu-latest
    # Scans the runner toolchain's stdlib plus module dependency reachability.
    # Non-blocking so a freshly-published stdlib advisory on a pinned release
    # surfaces findings for review without reddening the whole workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
